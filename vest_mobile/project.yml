name: vest
options:
  bundleIdPrefix: com.vest
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Domain:
    path: Modules/Domain
  Data:
    path: Modules/Data
  Core:
    path: Modules/Core
  Presentation:
    path: Modules/Presentation
  Factory:
    url: https://github.com/hmlongco/Factory.git
    from: "2.3.0"

targets:
  vest:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        buildPhase: resources
      - path: App/Resources/Config.json
        buildPhase: resources
    dependencies:
      - package: Domain
      - package: Data
      - package: Core
      - package: Presentation
      - package: Factory
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: vest
        NSFaceIDUsageDescription: "vest uses Face ID to protect your portfolio data."
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/vest.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.vest.app
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
